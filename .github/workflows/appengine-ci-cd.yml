
name: App Engine CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'hello_world/**'
      - 'simple_web_app/**'
      - 'test_apps.py'
      - '.github/workflows/appengine-ci-cd.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hello_world/requirements.txt
          pip install -r simple_web_app/requirements.txt

      - name: Run automated tests
        run: python test_apps.py

  deploy:
    name: Deploy to Google App Engine
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: firm-capsule-511903-a8
          workload_identity_provider: projects/392881515303/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@firm-capsule-511903-a8.iam.gserviceaccount.com

      - name: Deploy to App Engine
        id: deploy
        uses: google-github-actions/deploy-appengine@v3
        with:
          project_id: firm-capsule-511903-a8
          working_directory: simple_web_app
          deliverables: app.yaml
          promote: true

      - name: Verify deployment
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.version_url }}"
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "${{ steps.deploy.outputs.version_url }}"

