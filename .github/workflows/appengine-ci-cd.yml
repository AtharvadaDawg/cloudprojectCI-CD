
name: App Engine CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'hello_world/**'
      - 'simple_web_app/**'
      - 'test_apps.py'
      - '.github/workflows/appengine-ci-cd.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install dependencies and test applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hello_world/requirements.txt
          pip install -r simple_web_app/requirements.txt

      - name: Run automated tests
        run: |
          python test_apps.py
